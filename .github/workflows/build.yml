# Builds cordinal for Windows (build.bat cdpack, packed by cdpack/) and natively for Linux.
# The Linux release is built on Debian 13 so one binary runs on other current glibc
# distributions (SDL3; HTTPS is compiled in). Development containers stay on Arch. The installer is
# checked on Debian and Arch. A GitHub release is published for a v* tag, or for a push to
# main whose version (src/cordinal.rc) has no release yet.
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The release player is packed by cordinal's own packer (cdpack/). Its loader is built with
      # LLVM-MinGW's clang and its encoder and verifier run on Python; neither ships in the player.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.14'
      - name: Install LLVM-MinGW
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest -Uri 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-x86_64.zip' -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($hash -ne 'b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35') { throw "LLVM-MinGW hash $hash" }
          & "$env:SystemRoot\System32\tar.exe" -x -f $zip -C $env:RUNNER_TEMP
          if ($LASTEXITCODE) { throw 'Extracting LLVM-MinGW failed.' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP 'llvm-mingw-20260616-ucrt-x86_64\bin')
      - name: Build
        shell: cmd
        env:
          CDPACK_PYTHON: ${{ steps.python.outputs.python-path }}
        run: build.bat cdpack
      # cdpack's own suite: decoder corpora, corruption, and packed EXE/DLL fixtures (TLS, threads,
      # relocation) run on this runner's Windows.
      - name: Check the packer
        shell: pwsh
        run: |
          & '${{ steps.python.outputs.python-path }}' cdpack/tests/verify.py --tools build/tools/cdpack
          if ($LASTEXITCODE) { throw 'cdpack checks failed.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            build/cordinal.exe
            build/cordinal-test.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 40
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates cmake git pkg-config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux -j"$(nproc)"
      - name: Check HTTPS
        run: |
          build-linux/cordinal-core-test tls
          away=$(mktemp -d) && build-linux/cordinal-core-test away "$away"
          # BearSSL is compiled in; the program must not load the distribution's TLS library.
          ! readelf -d build-linux/cordinal | grep -E 'libssl|libcrypto'
      - name: Check fonts
        run: |
          fonts=$(mktemp -d) && build-linux/cordinal-core-test fonts "$fonts"
          # Fonts are found and matched in-repo; the program must not load fontconfig.
          ! readelf -d build-linux/cordinal | grep libfontconfig
          ! ldd build-linux/cordinal | grep libfontconfig
          # fc-match is the reference for the installed fonts' matches; it is installed only after the build.
          apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core fonts-noto-color-emoji
          build-linux/cordinal-core-test fonts-match
      - name: Check text
        run: |
          # Text is laid out and drawn in-repo; the program must not load SDL3_ttf, FreeType or HarfBuzz.
          ! readelf -d build-linux/cordinal | grep -E 'libSDL3_ttf|libfreetype|libharfbuzz'
          ! ldd build-linux/cordinal | grep -E 'libSDL3_ttf|libfreetype|libharfbuzz'
          text=$(mktemp -d) && build-linux/cordinal-core-test text "$text"
      - name: Check audio
        run: |
          # Sound goes through in-repo PipeWire and PulseAudio clients; the program must not link
          # libpipewire, libpulse or libasound.
          ! readelf -d build-linux/cordinal | grep -E 'libpipewire|libspa|libpulse|libasound'
          ! ldd build-linux/cordinal | grep -E 'libpipewire|libspa|libpulse|libasound'
          ! readelf -d build-linux/cordinal-core-test | grep -E 'libpipewire|libspa|libpulse|libasound'
          ! ldd build-linux/cordinal-core-test | grep -E 'libpipewire|libspa|libpulse|libasound'
          # Real servers to play to, installed only after the build: headless PipeWire with two null sinks.
          apt-get install -y --no-install-recommends pipewire pipewire-bin pipewire-pulse wireplumber \
            pulseaudio-utils dbus-daemon python3
          tools/audio-check.sh build-linux/cordinal-core-test
      - name: Check the platform layer
        run: |
          # Windows, input and drawing are in-repo (src/linux/platform); the program needs nothing
          # beyond glibc: not SDL3, libX11/libxcb, libwayland or libxkbcommon, and not even libstdc++.
          readelf -d build-linux/cordinal | grep NEEDED
          ! readelf -d build-linux/cordinal | grep NEEDED | grep -vE '\[(libc|libm|ld-linux-x86-64)\.so'
          ! ldd build-linux/cordinal | grep -E 'libSDL|libX11|libxcb|libwayland|libxkbcommon|libGL|libEGL|libvulkan|libstdc|not found'
          # The newest glibc symbol it asks for: 2.36 (Debian 12), see src/linux/glibc_compat.cpp.
          ! objdump -T build-linux/cordinal | grep -oE 'GLIBC_2\.[0-9]+' | sort -Vu | awk -F. '$2 > 36' | grep .
          build-linux/cordinal --check-layout
          # Real window systems, installed only after the build: Xvfb (with xfwm4) and headless sway.
          apt-get install -y --no-install-recommends xvfb xfwm4 xdotool xclip x11-xserver-utils x11-utils \
            sway wl-clipboard grim libxkbcommon-tools python3 python3-pil
          cmake --build build-linux --target cordinal-platform-probe -j"$(nproc)"
          tools/platform-gui-test.sh build-linux/cordinal-platform-probe all
      - name: Fuzz the platform parsers
        run: |
          # X11 setup, framing, Xauthority, XSETTINGS, resources, Xcursor, URI lists, Wayland
          # messages and XKB keymaps, under ASan and UBSan for a minute, seeded with real keymaps.
          apt-get install -y --no-install-recommends clang libclang-rt-dev
          clang++ -std=c++20 -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all -Isrc/linux -Isrc \
            src/tests/fuzz_platform.cpp src/linux/platform/x11_wire.cpp src/linux/platform/wayland_wire.cpp \
            src/linux/platform/xkb_keymap.cpp src/linux/platform/keys.cpp -o fuzz-platform
          mkdir -p corpus
          for layout in us de fr ru gr; do
            { printf '\011'; xkbcli compile-keymap --layout "$layout"; } > "corpus/keymap-$layout"
          done
          ./fuzz-platform -max_len=131072 -max_total_time=60 -timeout=10 corpus
      - name: Package
        run: |
          sh linux/install.sh --self-test
          mkdir -p dist cordinal
          install -m 755 build-linux/cordinal cordinal/cordinal
          install -m 755 linux/install.sh cordinal/install.sh
          install -m 644 linux/cordinal.desktop cordinal/cordinal.desktop
          install -m 644 docs/icon.png cordinal/cordinal.png
          install -m 644 LICENSE cordinal/LICENSE
          strip cordinal/cordinal
          tar -czf dist/cordinal-linux-x64.tar.gz cordinal
          (cd dist && sha256sum cordinal-linux-x64.tar.gz > cordinal-linux-x64.tar.gz.sha256)
          (cd dist && sha256sum -c cordinal-linux-x64.tar.gz.sha256)
          cp linux/install.sh dist/
          ls -l dist cordinal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/
          if-no-files-found: error

  # The installer the way a user runs it, against the package just built (no download).
  linux-install-debian:
    needs: linux
    runs-on: ubuntu-24.04
    # The oldest systems the build runs on (glibc 2.36 and 2.39) and the one it is built on.
    strategy:
      matrix:
        image: ['debian:12', 'ubuntu:24.04', 'debian:13']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: dist
      - name: Install with apt
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo
          useradd -m tester
          printf '%s\n' 'tester ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/tester
          chmod 440 /etc/sudoers.d/tester
          tar -xzf dist/cordinal-linux-x64.tar.gz -C /home/tester
          chown -R tester /home/tester
          su tester -c 'sh /home/tester/cordinal/install.sh --no-ffmpeg'
          su tester -c 'test -x ~/.local/bin/cordinal && test -f ~/.local/share/applications/cordinal.desktop'
          su tester -c 'grep -q "^Exec=/home/tester/.local/bin/cordinal %F$" ~/.local/share/applications/cordinal.desktop'
          su tester -c '! ldd ~/.local/bin/cordinal | grep "not found"'
          # It runs here, not only loads: the layout checks (one starts a private D-Bus).
          apt-get install -y --no-install-recommends dbus-daemon fonts-dejavu-core
          su tester -c '~/.local/bin/cordinal --check-layout'
          su tester -c 'sh /home/tester/cordinal/install.sh --uninstall && test ! -e ~/.local/bin/cordinal'
  linux-install-arch:
    needs: linux
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: dist
      - name: Install with pacman
        run: |
          pacman -Syu --noconfirm --needed sudo
          useradd -m tester
          printf '%s\n' 'tester ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/tester
          chmod 440 /etc/sudoers.d/tester
          tar -xzf dist/cordinal-linux-x64.tar.gz -C /home/tester
          chown -R tester /home/tester
          su tester -c 'sh /home/tester/cordinal/install.sh --dry-run'
          su tester -c 'sh /home/tester/cordinal/install.sh'
          su tester -c 'test -x ~/.local/bin/cordinal && test -f ~/.local/share/applications/cordinal.desktop'
          su tester -c '! ldd ~/.local/bin/cordinal | grep "not found"'
          su tester -c 'sh /home/tester/cordinal/install.sh --uninstall && test ! -e ~/.local/bin/cordinal'

  release:
    needs: [windows, linux, linux-install-debian, linux-install-arch]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Publish
        run: |
          version=$(sed -n 's/.*VALUE "ProductVersion", "\(.*\)".*/\1/p' src/cordinal.rc)
          tag="v$version"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version $version in src/cordinal.rc"; exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists already"; exit 0
          fi
          gh release create "$tag" artifacts/linux/* artifacts/windows/cordinal.exe --target "$GITHUB_SHA" \
            --title "cordinal $version" --generate-notes
